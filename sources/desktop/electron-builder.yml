appId: com.smg2026.app
productName: SMG2026
directories:
  buildResources: build
  output: dist
compression: maximum
asar: true
asarUnpack:
  - "**/*.node"
electronLanguages:
  - en-US
files:
  - "out/**/*"
  - "package.json"
  - "!**/.vscode/*"
  - "!src/*"
  - "!launcher/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  - "!**/node_modules/**/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/**/{docs,doc,website,demo,demos,fixtures}"
  - "!**/node_modules/**/*.{md,ts,map,tsbuildinfo,d.ts}"
  - "!**/*.{log,map,tsbuildinfo}"
  - "!**/node_modules/.cache/**"
  - "!**/node_modules/.bin/**"
extraFiles:
  - from: "documents"
    to: "documents"
    filter: "**/*"
win:
  executableName: SMG2026
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SMG2026
  artifactName: SMG2026-${version}-setup.${ext}
  include: "build/installer.nsh"
npmRebuild: false
